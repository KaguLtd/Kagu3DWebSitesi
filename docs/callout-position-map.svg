<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #020711; }
      .grid { stroke: rgba(216,246,255,0.12); stroke-width: 1; }
      .axis { stroke: rgba(78,231,255,0.55); stroke-width: 2; stroke-dasharray: 10 10; }
      .label { fill: #d8f6ff; font-family: Arial, sans-serif; font-size: 18px; letter-spacing: 1px; }
      .small { fill: rgba(216,246,255,0.72); font-family: Arial, sans-serif; font-size: 14px; }
      .tiny { fill: rgba(216,246,255,0.62); font-family: Arial, sans-serif; font-size: 12px; }
      .model { fill: rgba(232,247,251,0.16); stroke: rgba(232,247,251,0.8); stroke-width: 3; }
      .model-detail { fill: none; stroke: rgba(232,247,251,0.38); stroke-width: 2; }
      .anchor { fill: #4ee7ff; stroke: #ffffff; stroke-width: 2; }
      .card { fill: rgba(7,20,38,0.66); stroke: rgba(78,231,255,0.72); stroke-width: 2; }
      .card-center { fill: #ffda6a; stroke: #ffffff; stroke-width: 2; }
      .leader { stroke: rgba(78,231,255,0.5); stroke-width: 2; fill: none; }
      .note { fill: rgba(7,20,38,0.78); stroke: rgba(78,231,255,0.35); stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(78,231,255,0.72)" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="900" />
  <rect x="0" y="0" width="1440" height="900" fill="url(#fade)" opacity="0" />

  <!-- 120px coordinate grid -->
  <g>
    <path class="grid" d="M 120 0 V 900 M 240 0 V 900 M 360 0 V 900 M 480 0 V 900 M 600 0 V 900 M 720 0 V 900 M 840 0 V 900 M 960 0 V 900 M 1080 0 V 900 M 1200 0 V 900 M 1320 0 V 900" />
    <path class="grid" d="M 0 120 H 1440 M 0 240 H 1440 M 0 360 H 1440 M 0 480 H 1440 M 0 600 H 1440 M 0 720 H 1440 M 0 840 H 1440" />
    <path class="axis" d="M 720 0 V 900 M 0 450 H 1440" />
  </g>

  <!-- coordinate labels -->
  <g>
    <text class="tiny" x="8" y="18">0,0</text>
    <text class="tiny" x="700" y="22">viewport center x=720</text>
    <text class="tiny" x="8" y="455">viewport center y=450</text>
    <text class="tiny" x="1368" y="892">1440,900</text>
  </g>

  <!-- approximate AC front-view silhouette in viewport coordinates -->
  <g id="ac-front-map">
    <rect class="model" x="390" y="382" width="660" height="154" rx="12" />
    <path class="model-detail" d="M 410 505 H 1030" />
    <path class="model-detail" d="M 450 528 C 585 555, 850 555, 990 528" />
    <text class="label" x="612" y="370">AC MODEL APPROX FRONT VIEW</text>
    <text class="small" x="548" y="570">Mark model anchor points on this silhouette: A1, A2, A3...</text>
  </g>

  <!-- current projected anchor examples, approximate neutral view -->
  <g id="current-anchor-examples">
    <circle class="anchor" cx="440" cy="426" r="8" /><text class="small" x="454" y="431">A1</text>
    <circle class="anchor" cx="720" cy="520" r="8" /><text class="small" x="734" y="525">A2</text>
    <circle class="anchor" cx="1000" cy="430" r="8" /><text class="small" x="1014" y="435">A3</text>
    <circle class="anchor" cx="610" cy="392" r="8" /><text class="small" x="624" y="397">A4</text>
    <circle class="anchor" cx="835" cy="465" r="8" /><text class="small" x="849" y="470">A5</text>
    <circle class="anchor" cx="1000" cy="512" r="8" /><text class="small" x="1014" y="517">A6</text>
  </g>

  <!-- sample card center targets -->
  <g id="sample-card-centers">
    <rect class="card" x="92" y="320" width="236" height="88" rx="8" />
    <circle class="card-center" cx="210" cy="364" r="7" />
    <text class="small" x="112" y="350">C1 center</text>
    <path class="leader" d="M 440 426 C 338 426, 338 364, 328 364" marker-end="url(#arrow)" />

    <rect class="card" x="602" y="654" width="236" height="88" rx="8" />
    <circle class="card-center" cx="720" cy="698" r="7" />
    <text class="small" x="622" y="684">C2 center</text>
    <path class="leader" d="M 720 520 C 720 592, 720 632, 720 654" marker-end="url(#arrow)" />

    <rect class="card" x="1112" y="320" width="236" height="88" rx="8" />
    <circle class="card-center" cx="1230" cy="364" r="7" />
    <text class="small" x="1132" y="350">C3 center</text>
    <path class="leader" d="M 1000 430 C 1080 430, 1080 364, 1112 364" marker-end="url(#arrow)" />
  </g>

  <g id="instructions">
    <rect class="note" x="32" y="702" width="500" height="156" rx="10" />
    <text class="label" x="56" y="735">HOW TO MARK THIS</text>
    <text class="small" x="56" y="766">1. Put a yellow dot where each card center should be: C1, C2...</text>
    <text class="small" x="56" y="792">2. Put a cyan dot on the AC where each arrow should start: A1, A2...</text>
    <text class="small" x="56" y="818">3. Send me the edited SVG/image or write coordinates like:</text>
    <text class="small" x="80" y="844">C1 = 210,364 / A1 = 440,426</text>
  </g>

  <g id="axis-note">
    <rect class="note" x="890" y="702" width="510" height="156" rx="10" />
    <text class="label" x="914" y="735">SCREEN COORDINATES</text>
    <text class="small" x="914" y="766">x grows left to right. y grows top to bottom.</text>
    <text class="small" x="914" y="792">This map is 1440 x 900. I will translate your marks</text>
    <text class="small" x="914" y="818">into responsive card offsets and model localAnchor points.</text>
    <text class="small" x="914" y="844">Use approximate placement; pixel-perfect is not required.</text>
  </g>
</svg>
